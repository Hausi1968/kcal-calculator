name: Android-APK bauen

# Baut die APK, wenn sich die App-Hülle ändert, und veröffentlicht sie als GitHub-Release.
# Inhalte der Website brauchen KEINE neue APK – die kommen live über GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # Android-SDK ist hier vorinstalliert
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional: eigener Signaturschlüssel als Secret (KEYSTORE_BASE64 + Passwörter).
      # Ohne Secrets wird der Schlüssel aus android/app/kalorienkompass.jks verwendet.
      - name: Signaturschlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk KalorienKompass.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: KalorienKompass App 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android-App KalorienKompass, Build ${{ github.run_number }}.
            Installieren: KalorienKompass.apk auf dem Handy herunterladen und öffnen.
          files: KalorienKompass.apk
